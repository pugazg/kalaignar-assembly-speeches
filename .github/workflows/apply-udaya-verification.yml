name: Apply Udhaya Kathir verification

on:
  push:
    paths:
      - 'scripts/apply_udaya_kathir_verification.py'
      - '.github/workflows/apply-udaya-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply verified source corrections
        run: python scripts/apply_udaya_kathir_verification.py

      - name: Commit canonical verified text
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/speeches.json \
            speeches/1970/1970-09-09-no-confidence-motion/README.md \
            speeches/1970/1970-09-09-no-confidence-motion/metadata.json \
            speeches/1970/1970-09-09-no-confidence-motion/transcript.md
          git commit -m 'Apply verified Udhaya Kathir transcription corrections'
          git push
