name: Speech 10 Gate E Final
on:
  push:
    paths:
      - '.github/workflows/speech10-gate-e-final.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Close Gate E
        shell: python
        run: |
          from pathlib import Path
          import json, re

          base = Path('speeches/2006/2006-08-23-industries-debate')

          # metadata
          p = base/'metadata.json'
          m = json.loads(p.read_text())
          t = m['transcription']
          t.update({
              'status':'verified',
              'gate_e_status':'passed',
              'verified_against_scan':True,
              'verified_scan_pages':'304-326',
              'verified_printed_pages':'303-325',
              'verified_page_count':23,
              'strict_full_speech_visual_verification':True,
              'gate_e_audited_scan_pages':'304-326',
              'gate_e_audited_printed_pages':'303-325',
              'gate_e_audited_page_count':23,
              'gate_e_total_page_count':23,
              'gate_e_correction_count':6,
              'gate_e_next_scan_page':None,
              'unresolved_readings':0,
              'explicit_unresolved_reading_markers':0,
              'completion_note':'Gate C completed all 23 mapped Speech-10 pages and Gate D passed the structural completeness/page-marker/boundary audit. Gate E directly re-read all source pp.304-326 / printed pp.303-325 against the controlling rendered scan. Six definite source-supported corrections were applied cumulatively: p.305 `கடமைப்பட்டிருக்கின்றேன்` → `கடமைப் பட்டிருக்கின்றேன்`; p.307 `Equity, சிறிய பகுதியாகும்.` → `Equity, சிறிய பகுதியேயாகும்.`; p.312 `அனைத்துச் கூட்டுறவுச் சர்க்கரை ஆலைகளுக்கு` → `அனைத்துக் கூட்டுறவுச் சர்க்கரை ஆலைகளுக்கு`; p.314 `குற்றம் சுமத்திவிட்டாலேயே` → `குற்றம் சுமத்திவிட்டதாலேயே`; p.315 `சமூகாயப் பொருளாதார` → `சமுதாயப் பொருளாதார`; p.316 `உயர்கும் உன்னதமான` → `உயரும் உன்னதமான`. Final Batch 5 (pp.324-326) required no canonical Tamil correction. Rendered p.326 was verified through the final paragraph, desk-thumping marker and closing ornament; pp.327-329 remain excluded non-speech material. Tamil is verified against the scan.'
          })
          tr = m['translation']
          tr.update({'status':'not-started','gate_f_status':'not-started','gate_g_status':'not-started','tamil_gate_satisfied':True,'verified_against_tamil':False})
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n')

          # transcript verification note only; body remains untouched
          p = base/'transcript.md'
          s = p.read_text()
          s = re.sub(r'> \*\*Tamil verification note:\*\*.*?\n\n---',
              '> **Tamil verification note:** Gate C is complete, Gate D passed, and Gate E has now directly re-read the full mapped speech — source/scan pp.304–326 / printed pp.303–325 — against the controlling rendered scan. Six definite source-supported corrections were applied cumulatively; final Batch 5 (pp.324–326) required **no canonical Tamil correction**. Tamil status: **verified against scan**. Unresolved readings: **0**.\n\n---', s, count=1, flags=re.S)
          p.write_text(s)

          # README
          p = base/'README.md'; s=p.read_text()
          s = re.sub(r'- Tamil: \*\*transcribed; not verified\*\*\.', '- Tamil: **verified against the controlling scan**.', s)
          s = re.sub(r'- Gate E: \*\*in progress[^\n]*', '- Gate E: **passed — 23/23 pages verified, 6 definite corrections, 0 unresolved readings**.', s)
          s = re.sub(r'- English Gate F: \*\*blocked until verified Tamil is complete\*\*\.', '- English Gate F: **unblocked; not started**.', s)
          s = re.sub(r'The next activity is \*\*Gate E final Batch 5.*?Do not begin English yet\.', 'The next activity is **Gate F — English translation from the final verified Tamil**, retaining Kalaignar’s parliamentary language, humour, repetition, rhetoric, political phrasing, register shifts and printed English without generic smoothing.', s, flags=re.S)
          p.write_text(s)

          # source notes append final batch
          p=base/'source-notes.md'; s=p.read_text()
          s += '''\n## Gate E Batch 5 — source pp.324–326 / printed pp.323–325\n\nThe final three pages were directly re-read against the controlling rendered scan. **No canonical Tamil source-text correction was required in this batch.**\n\nThe reread re-confirmed without normalisation: p.324 `Natural gas distribution network`, the 10-kilometre sugarcane-lorry-rent promise, `40 கோடி`, the new IT-policy announcement and `4-7-2000` TIDEL continuation; p.325 the second TIDEL park, Coimbatore IT park, Madurai/Trichy/Salem/Tirunelveli IT parks, the Indian institute announcement, `I.T. Task Force`, `e-governance`, and the Tamil Internet University building/one-crore announcement; p.326 `I.T. Expressway`, `205 கோடி`, the 25-kilometre six-lane extension, the 24-kilometre Singaperumal Koil–Sriperumbudur and 20-kilometre Vandalur–Walajabad road passages, `300 கோடி`, the final inclusive response to supportive and opposing views, the desk-thumping marker, and the printed closing ornament.\n\nGate E is **passed** for all **23/23 pages**. Cumulative definite corrections: **6**. Unresolved readings: **0**. Tamil is verified against the controlling scan.\n'''
          p.write_text(s)

          # verification log
          p=base/'verification-log.md'; s=p.read_text()
          s = s.replace('- Gate E: **in progress**;','- Gate E: **passed — 23/23 pages verified**;')
          s = s.replace('- Gate F English: **blocked**;','- Gate F English: **unblocked / not started**;')
          s = re.sub(r'## Exact next activity\n\n.*?\n\n\n## Gate E', '## Exact next activity\n\nBegin **Gate F — English translation from the final verified Tamil**, preserving Kalaignar’s parliamentary voice and source-page correspondence. Do not call English verified until Gate G passes.\n\n\n## Gate E', s, flags=re.S)
          s += '''\n### Batch 5 — source pp.324–326 / printed pp.323–325\n\n**Complete.** All three final mapped pages were directly re-read against the controlling rendered scan.\n\n- cumulative Gate-E coverage: **23/23 pages**;\n- definite corrections in Batch 5: **0**;\n- cumulative definite Gate-E corrections: **6**;\n- unresolved readings: **0**;\n- closing boundary: **verified through p.326 final paragraph, desk-thumping marker and ornament**;\n- pp.327–329 non-speech material: **excluded**.\n\nNo canonical Tamil source-text correction was required on pp.324–326. Gate E is **passed** and `verified_against_scan=true`. Tamil is **verified**. English Gate F is now unblocked but has not started.\n'''
          p.write_text(s)

          # handover
          p=Path('docs/HANDOVER_2007_INDUSTRIAL_SPEECHES.md'); s=p.read_text()
          s = re.sub(r'- Tamil status: \*\*transcribed; not verified\*\*;', '- Tamil status: **verified**;', s)
          s = re.sub(r'- `verified_against_scan`: \*\*false\*\*;', '- `verified_against_scan`: **true**;', s)
          s = re.sub(r'- Gate E: \*\*in progress[^\n]*', '- Gate E: **passed — 23/23 pages verified; 6 definite corrections; 0 unresolved readings**;', s)
          s = re.sub(r'- English Gate F: \*\*blocked\*\*\.', '- English Gate F: **unblocked; not started**.', s)
          s = re.sub(r'Gate D is structural only\..*?## Exact next activity — Speech 10 Gate E Batch 3\n\n1\..*?6\. Do not begin English until Gate E is complete\.', 'Gate E has now completed the full direct source-fidelity reread. Tamil is verified against the controlling scan.\n\n## Exact next activity — Speech 10 Gate F\n\n1. Translate only from the final verified Tamil in `transcript.md`.\n2. Preserve source-page correspondence.\n3. Retain Kalaignar’s parliamentary language, long argumentative movement, repetitions, humour, rhetorical questions, political phrasing and register shifts rather than smoothing them into generic English.\n4. Preserve printed English as printed where it appears in the Tamil source.\n5. Do not silently correct source claims, figures or unusual wording.\n6. Keep English unverified until the separate Gate G fidelity review is complete.', s, flags=re.S)
          p.write_text(s)
      - name: Commit Gate E closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add speeches/2006/2006-08-23-industries-debate docs/HANDOVER_2007_INDUSTRIAL_SPEECHES.md
          git commit -m "Close Speech 10 Tamil Gate E" || exit 0
          git push
