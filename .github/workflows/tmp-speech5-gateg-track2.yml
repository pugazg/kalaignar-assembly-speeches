name: Temporary Speech 5 Gate G tracking 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  track:
    if: github.event.head_commit.message == 'Temporary finish Speech 5 Gate G tracking'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Gate G tracking files
        shell: python
        run: |
          from pathlib import Path
          import base64
          marker = '## Gate F — English translation\n'
          notes_tail = base64.b64decode('').decode('utf-8')
          vlog_tail = base64.b64decode('').decode('utf-8')
          for path, tail in [
              ('speeches/1996/1996-08-14-industries-debate/source-notes.md', notes_tail),
              ('speeches/1996/1996-08-14-industries-debate/verification-log.md', vlog_tail),
          ]:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: Gate F marker count {text.count(marker)}')
              p.write_text(text.split(marker, 1)[0] + tail, encoding='utf-8')
      - name: Commit Gate G tracking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add speeches/1996/1996-08-14-industries-debate/source-notes.md speeches/1996/1996-08-14-industries-debate/verification-log.md
          git commit -m "Document Speech 5 Gate G verification"
          git push
