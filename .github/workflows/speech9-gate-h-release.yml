name: Speech 9 Gate H release

on:
  push:
    paths:
      - '.github/workflows/speech9-gate-h-release.yml'

permissions:
  contents: write

jobs:
  release-speech-9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate canonical release
        run: python3 scripts/speech9_gate_h_release.py

      - name: Commit Gate H release
        run: |
          rm -f .github/workflows/speech9-gate-h-release.yml scripts/speech9_gate_h_release.py
          git config user.name 'kalaignar-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Release Speech 9 through Gate H'
          git push
