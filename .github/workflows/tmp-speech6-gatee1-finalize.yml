name: Temporary Speech 6 Gate E Batch 1 Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-speech6-gatee1-finalize.yml'

permissions:
  contents: write

jobs:
  patch-transcript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply assertion-checked source corrections
        shell: python
        run: |
          from pathlib import Path

          path = Path('speeches/1997/1997-04-23-industries-debate/transcript.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "தமிழகத்திலே இருந்து செய்யப்படும் ஏற்றுமதி, உலக அளவிலான வீழ்ச்சி இல்லை;",
                  "தமிழகத்திலே இருந்து செய்யப்படும் ஏற்றுமதி, உலக அளவிலான விழுக்காடு வீழ்ச்சி இல்லை;",
              ),
              (
                  "'சிப்காட்'னுடைய பணத்தைத் திரும்பப்பெற",
                  "'சிப்காட்'டினுடைய பணத்தைத் திரும்பப்பெற",
              ),
              (
                  "'சிப்காட்'ன் சார்பாக ஒரு தொழில் நிறுவனத்தை",
                  "'சிப்காட்'டின் சார்பாக ஒரு தொழில் நிறுவனத்தை",
              ),
              (
                  "> **Archival transcription note:** This is a Gate-C first-pass Tamil transcription from the controlling May 2007 scan. Speech 6 is locked to PDF scan pp.172–198 / printed pp.171–197. This file now covers the complete Gate-C first-pass Tamil transcription, scan pp.172–198 / printed pp.171–197. The scan image is authoritative; wording, historical spelling, punctuation, numerals, headings, speaker labels, interventions and printed English are preserved as visible, with only physical line wrapping normalised. This first pass is **not yet verified**.",
                  "> **Archival transcription note:** This is the complete Gate-C Tamil transcription from the controlling May 2007 scan, structurally audited at Gate D. Speech 6 is locked to PDF scan pp.172–198 / printed pp.171–197. Gate E strict visual/source-fidelity verification is in progress: Batch 1, scan pp.172–186 / printed pp.171–185, has been directly audited against the scan; the remaining pp.187–198 are not yet Gate-E verified. The scan image is authoritative; wording, historical spelling, punctuation, numerals, headings, speaker labels, interventions and printed English are preserved as visible, with only physical line wrapping normalised. Tamil remains **transcribed, not fully verified** until Gate E covers the complete speech.",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit transcript changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add speeches/1997/1997-04-23-industries-debate/transcript.md
          git diff --cached --check
          git commit -m 'Complete Speech 6 Gate E batch 1 transcript corrections'
          git push
