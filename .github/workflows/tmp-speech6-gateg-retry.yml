name: Temporary Speech 6 Gate G Retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-speech6-gateg-retry.yml'

permissions:
  contents: write

jobs:
  retry-gate-g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse validated Gate G transformation
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-speech6-gateg-finalize.yml').read_text(encoding='utf-8').splitlines()
          start = None
          end = None
          for i, line in enumerate(workflow):
              if line.strip() == '- name: Apply Gate G corrections and finalize English':
                  for j in range(i + 1, len(workflow)):
                      if workflow[j].strip() == 'run: |':
                          start = j + 1
                          break
              if start is not None and i > start and line.strip() == '- name: Commit Speech 6 Gate G completion':
                  end = i
                  break
          if start is None or end is None:
              raise SystemExit('Could not locate validated Gate G Python transformation')
          code_lines = workflow[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in code_lines)
          exec(compile(code, '<gate-g-transform>', 'exec'), {})
      - name: Commit Speech 6 Gate G completion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            speeches/1997/1997-04-23-industries-debate/translation.md \
            speeches/1997/1997-04-23-industries-debate/transcript.md \
            speeches/1997/1997-04-23-industries-debate/metadata.json \
            speeches/1997/1997-04-23-industries-debate/README.md \
            speeches/1997/1997-04-23-industries-debate/source-notes.md \
            speeches/1997/1997-04-23-industries-debate/verification-log.md
          git commit -m 'Verify Speech 6 English against final Tamil'
          git push
