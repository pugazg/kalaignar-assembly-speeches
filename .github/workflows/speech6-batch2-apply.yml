name: Apply Speech 6 Batch 2

on:
  push:
    paths:
      - 'speeches/1997/1997-04-23-industries-debate/_batch2_append.tmp'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append Batch 2 and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = Path('speeches/1997/1997-04-23-industries-debate')
          transcript = base / 'transcript.md'
          staging = base / '_batch2_append.tmp'

          text = transcript.read_text(encoding='utf-8')
          append = staging.read_text(encoding='utf-8')

          old_note = 'This file currently covers the first bounded batch, scan pp.172–186 / printed pp.171–185.'
          new_note = 'This file now covers the complete Gate-C first-pass Tamil transcription, scan pp.172–198 / printed pp.171–197.'
          if old_note not in text and new_note not in text:
              raise SystemExit('Expected archival-note text not found')
          text = text.replace(old_note, new_note)

          if '<!-- source-page: 187 -->' not in text:
              text = text.rstrip() + append

          markers = [int(x) for x in re.findall(r'<!-- source-page: (\d+) -->', text)]
          expected = list(range(172, 199))
          if markers != expected:
              raise SystemExit(f'Unexpected page markers: {markers}')
          if '<!-- source-page: 199 -->' in text or '**உரை : 7**' in text or 'நாள் : 14.05.1998' in text:
              raise SystemExit('Speech 7 spillover detected')
          if text.count('[REVIEW]') != 0:
              raise SystemExit('Unexpected REVIEW marker count')

          transcript.write_text(text, encoding='utf-8')
          staging.unlink()
          PY
      - name: Commit canonical transcript
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add speeches/1997/1997-04-23-industries-debate/transcript.md
          git add -u speeches/1997/1997-04-23-industries-debate/_batch2_append.tmp
          git commit -m 'Complete Speech 6 Gate C Tamil first pass'
          git push
