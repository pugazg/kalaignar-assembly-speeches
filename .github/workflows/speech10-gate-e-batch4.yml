name: Speech 10 Gate E Batch 4

on:
  push:
    paths:
      - '.github/workflows/speech10-gate-e-batch4.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Gate E Batch 4 verification
        run: python3 scripts/speech10_gate_e_batch4.py
      - name: Commit verification
        run: |
          rm -f .github/workflows/speech10-gate-e-batch4.yml scripts/speech10_gate_e_batch4.py
          git config user.name 'kalaignar-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Verify Speech 10 Gate E Batch 4'
          git push
