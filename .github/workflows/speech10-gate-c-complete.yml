name: Speech 10 Gate C completion

on:
  push:
    paths:
      - '.github/workflows/speech10-gate-c-complete.yml'

permissions:
  contents: write

jobs:
  complete-gate-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append remaining pages and close Gate C
        run: python3 scripts/speech10_gate_c_complete.py

      - name: Commit Gate C completion
        run: |
          rm -f .github/workflows/speech10-gate-c-complete.yml scripts/speech10_gate_c_complete.py tmp/speech10-gate-c-remaining.md
          git config user.name 'kalaignar-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Speech 10 Gate C transcription'
          git push
