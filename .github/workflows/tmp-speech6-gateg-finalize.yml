name: Temporary Speech 6 Gate G Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-speech6-gateg-finalize.yml'

permissions:
  contents: write

jobs:
  finalize-gate-g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Gate G corrections and finalize English
        shell: python
        run: |
          from pathlib import Path
          import json, re

          root = Path('speeches/1997/1997-04-23-industries-debate')
          translation_path = root / 'translation.md'
          transcript_path = root / 'transcript.md'
          metadata_path = root / 'metadata.json'
          readme_path = root / 'README.md'
          source_notes_path = root / 'source-notes.md'
          vlog_path = root / 'verification-log.md'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          tr = translation_path.read_text(encoding='utf-8')
          pages = [int(x) for x in re.findall(r'^### Source page (\d+)$', tr, flags=re.M)]
          expected = list(range(172, 199))
          if pages != expected:
              raise SystemExit(f'Unexpected translation page sequence before Gate G: {pages}')
          if '[REVIEW]' in tr or '### Source page 199' in tr:
              raise SystemExit('Unexpected review marker or Speech-7 spillover before Gate G')

          old_note = "> **Gate F translation note:** This is the complete first-pass English translation of the final verified Tamil transcription for scan pp.172–198 / printed pp.171–197. It preserves source-page correspondence, parliamentary context, names, figures, technical terminology, argument sequence, quotations and source claims. Printed English passages embedded in the Tamil source are reproduced in their source form, including visible anomalies. Gate F is **complete**, but the English is **not yet verified**; Gate G must re-read every English source-page section against the final verified Tamil before English can be marked verified."
          new_note = "> **Gate G verification note:** This is the complete English rendering of the final verified Tamil transcription for scan pp.172–198 / printed pp.171–197. It preserves source-page correspondence, parliamentary context, names, figures, technical terminology, argument sequence, quotations, humour/context markers, and unusual or internally inconsistent source claims without substituting external historical corrections. Printed English passages embedded in the Tamil source are reproduced in their source form, including visible anomalies. Gate F is complete and Gate G has **passed** after a full page-by-page fidelity review of all 27 English source-page sections against the final verified Tamil. Gate-G corrections are documented in `verification-log.md`. English status is **verified**."
          tr = replace_once(tr, old_note, new_note, 'translation note')

          # 1. p.172 — restore the desk-thump to the source-supported position.
          tr = replace_once(
              tr,
              "For, when Anna passed away, I asked him to lend me his heart, and it is with that heart which can bear anything that I have conducted my public life, particularly my political life. (Sound of desk-thumping.)",
              "For, when Anna passed away, I asked him to lend me his heart. (Sound of desk-thumping.) It is with that heart which can bear anything that I have conducted my public life, particularly my political life.",
              'p172 desk-thump position'
          )

          # 2. p.177 — தொழில் நிறுவனம் is an undertaking, not an industrial complex.
          tr = replace_once(
              tr,
              "and that SIPCOT itself could establish an industrial complex there.",
              "and that SIPCOT itself could establish an industrial undertaking there.",
              'p177 undertaking terminology'
          )

          # 3. p.178 — restore the source's explicit 1972 ELCOT clause/internal chronology.
          tr = replace_once(
              tr,
              "Similarly, in 1972, with a long-term plan that electronics industries should prosper in Tamil Nadu, an electronics division was created in the office of the Director of Industries and Commerce and various related industrial divisions were developed. The Electronic Corporation of Tamil Nadu was established in 1975 under the abbreviated name ‘ELCOT’—",
              "Similarly, it was in 1972 that the Tamil Nadu Electronics Corporation — ‘ELCOT’ — with a long-term plan that electronics industries should prosper in Tamil Nadu, created an electronics division in the office of the Director of Industries and Commerce in 1972 and, in connection with it, established various industrial divisions. Electronic Corporation of Tamil Nadu was established in 1975 under the abbreviated name ‘ELCOT’—",
              'p178 ELCOT chronology'
          )

          # 4. p.181 — preserve the printed/transliterated name anomaly இண்டார்.
          tr = replace_once(tr, "Inter Continental Leathers Limited", "Indar Continental Leathers Limited", 'p181 Indar name')

          # 5. p.182 — தொடக்க விழா does not itself say foundation-laying.
          tr = replace_once(
              tr,
              "the then President of India was invited to conduct the foundation ceremony for the North Chennai Thermal Power Station at that very site.",
              "the then President of India was invited to conduct the commencement ceremony for the North Chennai Thermal Power Station at that very site.",
              'p182 commencement ceremony'
          )

          # 6. p.184 — preserve பணிக்குழு as a task force rather than silently recasting it as a wing.
          tr = replace_once(
              tr,
              "In an inquiry conducted by the Vigilance Wing and the ‘Vigilance Commission’ in this connection,",
              "In an inquiry conducted by the Vigilance Task Force and the ‘Vigilance Commission’ in this connection,",
              'p184 vigilance terminology'
          )

          # 7. p.191 — each project is 50 hectares, not more than 50 hectares.
          tr = replace_once(
              tr,
              "The Government has decided to start four new Joint Sector projects using granite stone, each over 50 hectares, together covering 200 hectares, for industries based on granite.",
              "The Government has decided to start four new Joint Sector projects using granite stone, each covering 50 hectares, together covering 200 hectares, for industries based on granite.",
              'p191 hectare figure'
          )

          # 8. pp.194–195 — preserve நிலக்கரி as coal; do not silently make it more specific as lignite.
          coal_replacements = [
              ("The Jayankondam lignite company:", "The Jayankondam coal company:"),
              ("The Jayankondam Lignite Company, registered in 1991", "The Jayankondam Coal Company, registered in 1991"),
              ("for mining the lignite and supplying the required machinery", "for mining the coal and supplying the required machinery"),
              ("for the Jayankondam Lignite Company without calling tenders", "for the Jayankondam Coal Company without calling tenders"),
              ("4 million tonnes of lignite and 500 megawatts of electricity", "4 million tonnes of coal and 500 megawatts of electricity"),
          ]
          for i, (old, new) in enumerate(coal_replacements, 1):
              tr = replace_once(tr, old, new, f'pp194-195 coal terminology {i}')

          # 9. p.195 — source says a window, not a single window.
          tr = replace_once(
              tr,
              "has agreed to function as a single window (Window), giving entrepreneurs in Singapore information about investing in Tamil Nadu,",
              "has agreed to function as a window (Window), giving entrepreneurs in Singapore information about investing in Tamil Nadu,",
              'p195 window wording'
          )

          # 10. p.197 — preserve printed/transliterated டான்சம் rather than externally normalising the acronym.
          tr = replace_once(tr, "Through ‘TANCEM’,", "Through ‘Tansam’,", 'p197 Tansam name')

          # 11. p.197 — ஊர் is home/town, not an inferred constituency.
          tr = replace_once(
              tr,
              "asked how they could go back to their constituencies.",
              "asked how they could go back home.",
              'p197 go home wording'
          )

          # 12. p.197 — preserve the odd source wording விடேன் தொடேன் instead of silently smoothing it away.
          tr = replace_once(
              tr,
              "Therefore, this year I will pursue it without letting go until the factory comes; that will be my first task.",
              "Therefore, this year I will make the effort saying, “I will not leave it; I will not touch it,” so that the factory somehow comes; that will be my first task.",
              'p197 vidaen thodaen wording'
          )

          # Revalidate the corrected working translation.
          pages_after = [int(x) for x in re.findall(r'^### Source page (\d+)$', tr, flags=re.M)]
          if pages_after != expected:
              raise SystemExit(f'Unexpected translation page sequence after Gate G: {pages_after}')
          if '[REVIEW]' in tr or '### Source page 199' in tr:
              raise SystemExit('Unexpected review marker or Speech-7 spillover after Gate G')
          required_fragments = [
              'Indar Continental Leathers Limited',
              'Tamil Nadu Electronics Corporation — ‘ELCOT’',
              'each covering 50 hectares',
              'Jayankondam coal company',
              '4 million tonnes of coal',
              'function as a window (Window)',
              'Through ‘Tansam’',
              'I will not leave it; I will not touch it',
              'transparent appoach',
              'Financial Time',
              'Bernard Fintlay',
              'L.N.G. (Liquified Natural Gas)',
          ]
          for fragment in required_fragments:
              if fragment not in tr:
                  raise SystemExit(f'Missing required Gate-G fragment: {fragment}')
          translation_path.write_text(tr, encoding='utf-8')

          # Merge verified English after the verified Tamil, following the released Speech-5 layout.
          tamil = transcript_path.read_text(encoding='utf-8').rstrip()
          if '# English translation' in tamil:
              raise SystemExit('Canonical transcript already contains an English layer; refusing duplicate merge')
          tamil_pages = [int(x) for x in re.findall(r'<!-- source-page: (\d+) -->', tamil)]
          if tamil_pages != expected:
              raise SystemExit(f'Unexpected Tamil page markers before English merge: {tamil_pages}')
          first_line, blank, translation_body = tr.partition('\n\n')
          if not first_line.startswith('# English translation — உரை : 6') or not blank:
              raise SystemExit('Unexpected translation.md heading layout')
          combined = tamil + '\n\n---\n\n# English translation\n\n' + translation_body.rstrip() + '\n'
          transcript_path.write_text(combined, encoding='utf-8')

          # Metadata — Gate G passed, English verified.
          meta = json.loads(metadata_path.read_text(encoding='utf-8'))
          mt = meta['translation']
          mt.update({
              'placement': 'verified English follows the verified Tamil in canonical transcript.md; translation.md is retained as the verified working companion',
              'status': 'verified',
              'gate_f_status': 'complete',
              'gate_g_status': 'passed',
              'completed_source_pages': '172-198',
              'completed_page_count': 27,
              'total_page_count': 27,
              'source_page_correspondence': True,
              'unresolved_translation_questions': 0,
              'unresolved_english_fidelity_issues': 0,
              'verified_against_tamil': True,
              'verification_gate': 'Gate G passed',
              'verification_pages': '172-198',
              'gate_g_correction_count': 12,
              'completion_note': 'Gate F translated all 27 verified Tamil source-page sections 172-198. Gate G then re-read all 27 English sections page by page against the final verified Tamil, applied 12 fidelity corrections, and passed. The corrected verified English has been merged after the Tamil source layer in canonical transcript.md. English status is verified.'
          })
          metadata_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # README — advance status from Gate F to Gate G passed / Gate H next.
          rd = readme_path.read_text(encoding='utf-8')
          rd = replace_once(
              rd,
              "Speech 6 Tamil Gates C–E are complete and the Tamil is **verified against the controlling scan**. Gate F English translation is now **complete for all 27 source pages**, but English is **not yet verified**; Gate G remains required.",
              "Speech 6 Tamil Gates C–E are complete and the Tamil is **verified against the controlling scan**. Gate F English translation is complete for all 27 source pages, and Gate G has now **passed** after a full page-by-page fidelity review against the verified Tamil. English is **verified**. Gate H release/indexing remains separate and is not yet performed.",
              'README status paragraph'
          )
          rd = replace_once(rd, "- English status: **complete, unverified**.\n- Gate G English fidelity verification: **not started**.\n- Gate H release/indexing: **not started**.", "- English status: **verified against the final verified Tamil**.\n- Gate G English fidelity verification: **passed — 27/27 sections, 12 corrections, 0 unresolved fidelity issues**.\n- Canonical `transcript.md`: **verified Tamil followed by verified English**.\n- Gate H release/indexing: **not started**.", 'README status bullets')
          old_gatef_tail = "Gate F **does not** make the English verified. A separate Gate G page-by-page fidelity review against the final verified Tamil is still required before English can be merged into canonical `transcript.md` and marked verified.\n\n## Next activity\n\nProceed to **Gate G — English fidelity verification**. Re-read all **27 English source-page sections, 172–198**, against the final verified Tamil in canonical `transcript.md`; correct omissions, additions, mistranslations, names, figures, technical terminology, source anomalies and page-boundary issues. Only after Gate G passes may English be marked `verified` and incorporated after the Tamil source layer in canonical `transcript.md`. Do not begin Speech 7 or Gate-H root release/index changes yet."
          new_gatef_tail = "Gate F by itself did not make the English verified; that requirement has now been satisfied by Gate G.\n\n## Gate G — English fidelity verification\n\nStatus: **passed**. All **27 English source-page sections, 172–198**, were re-read against the final verified Tamil. Gate G checked completeness, omissions/additions, page-boundary continuity, names, figures, dates, money/units, technical terminology, lists, quotations, printed English, humour/context markers and source anomalies. **12 concrete fidelity corrections** were applied and recorded in `verification-log.md`; unresolved English fidelity issues are **0**.\n\nThe corrected verified English is now incorporated after the verified Tamil in canonical [`transcript.md`](./transcript.md). [`translation.md`](./translation.md) is retained as the verified working companion.\n\n## Next activity\n\nProceed to **Gate H — canonical release/indexing for Speech 6**. Audit consistency across the Speech-6 files, then update root `README.md` and `data/speeches.json` with the verified Tamil/English release state. Do not begin Speech 7 until Speech 6 Gate H is closed."
          rd = replace_once(rd, old_gatef_tail, new_gatef_tail, 'README Gate-F/G tail')
          rd = rd.replace("- [`translation.md`](./translation.md) — complete Gate-F English translation, not yet Gate-G verified.", "- [`translation.md`](./translation.md) — complete English translation, verified at Gate G.")
          rd = rd.replace("- [`metadata.json`](./metadata.json) — source metadata, verified Tamil status and Gate-F English status.", "- [`metadata.json`](./metadata.json) — source metadata plus verified Tamil and verified English status.")
          rd = rd.replace("- [`verification-log.md`](./verification-log.md) — itemised Gate-C/D/E record plus Gate-F completion and next Gate-G action.", "- [`verification-log.md`](./verification-log.md) — itemised Gate-C/D/E/F/G audit record and exact Gate-H continuation.")
          readme_path.write_text(rd, encoding='utf-8')

          # Source notes — replace Gate-F tail with complete F/G record and Gate-H continuation.
          sn = source_notes_path.read_text(encoding='utf-8')
          marker = '## Gate F — English translation\n'
          pos = sn.rfind(marker)
          if pos < 0:
              raise SystemExit('source-notes Gate F marker not found')
          sn = sn[:pos] + '''## Gate F — English translation\n\nStatus: **complete**.\n\nA complete first-pass English translation was produced in [`translation.md`](./translation.md) exclusively from the final Gate-E-verified Tamil in canonical `transcript.md`. It contains exactly **27 source-page sections, 172–198**, in source order, with no p.199/Speech-7 spillover and no unresolved Gate-F translation questions.\n\n## Gate G — English fidelity verification\n\nStatus: **passed; English verified**.\n\nAll 27 English sections were re-read against the final verified Tamil. The review covered completeness, omissions/additions, page boundaries, names, figures, dates, percentages, money/units, acreage, megawatts, industrial/technical terminology, lists, quotations, printed English passages, humour/context markers and source anomalies.\n\nTwelve concrete fidelity corrections were applied:\n\n1. p.172 restored the desk-thump to the source-supported position immediately after the request to borrow Anna's heart;\n2. p.177 `industrial complex` → `industrial undertaking` for source `தொழில் நிறுவனம்`;\n3. p.178 restored the omitted explicit 1972 `Tamil Nadu Electronics Corporation — ‘ELCOT’` clause, preserving the source's internally inconsistent 1972/1975 chronology rather than silently resolving it;\n4. p.181 `Inter Continental Leathers Limited` → `Indar Continental Leathers Limited`, preserving source `இண்டார்`;\n5. p.182 `foundation ceremony` → `commencement ceremony`, avoiding an unsupported foundation-laying inference from source `தொடக்க விழா`;\n6. p.184 `Vigilance Wing` → `Vigilance Task Force` for source `விழிப்புப் பணிக்குழு`;\n7. p.191 `each over 50 hectares` → `each covering 50 hectares`;\n8. pp.194–195 changed the Jayankondam passage from `lignite` to `coal` throughout, preserving source `நிலக்கரி` rather than silently making the claim more specific;\n9. p.195 `a single window (Window)` → `a window (Window)`;\n10. p.197 `TANCEM` → `Tansam`, preserving printed/transliterated `டான்சம்` rather than externally normalising it;\n11. p.197 `go back to their constituencies` → `go back home`, preserving source `ஊருக்குப் போவோம்`;\n12. p.197 restored the odd source wording `விடேன் தொடேன்` as `I will not leave it; I will not touch it` instead of smoothing it into `without letting go`.\n\nGate-G final result:\n\n- English sections audited: **27/27**, exactly **172–198**;\n- Gate-G corrections: **12**;\n- unresolved English fidelity issues: **0**;\n- p.199 / Speech-7 spillover: **none**;\n- `verified_against_tamil`: **true**;\n- English status: **verified**.\n\nThe corrected English has been incorporated after the verified Tamil in canonical [`transcript.md`](./transcript.md), following the released Speech-5 precedent.\n\n## Next activity\n\nProceed to **Gate H — canonical release/indexing for Speech 6**. Re-audit consistency across `metadata.json`, `README.md`, `source-notes.md`, `verification-log.md`, `translation.md`, and canonical `transcript.md`; then update root `README.md` and `data/speeches.json` with the verified Tamil and verified English release state. Do not begin Speech 7 until Gate H is closed.\n'''
          source_notes_path.write_text(sn, encoding='utf-8')

          # Verification log — preserve Gate-F record, add detailed Gate-G correction audit and Gate-H continuation.
          vl = vlog_path.read_text(encoding='utf-8')
          marker = '## Gate F — English translation\n'
          pos = vl.rfind(marker)
          if pos < 0:
              raise SystemExit('verification-log Gate F marker not found')
          vl = vl[:pos] + '''## Gate F — English translation\n\nStatus: **complete**.\n\nA complete first-pass English rendering was created in [`translation.md`](./translation.md) from the final verified Tamil, covering every source page **172–198**. Gate-F structural assertions confirmed exactly 27 ordered page headings, no p.199/Speech-7 spillover, no `[REVIEW]` markers, and 0 unresolved translation questions. Gate F itself did not confer verification.\n\n## Gate G — English fidelity verification\n\nStatus: **passed**.\n\nAll **27 English source-page sections, 172–198**, were re-read against the corresponding final verified Tamil. The audit checked completeness, additions/omissions, page-boundary continuity, names and initials, dates, percentages, rupee values, acreage, megawatts and other figures, industrial/technical terminology, lists, quotations, printed English passages, desk-thump/laughter markers, humour, source anomalies and the p.198 closing.\n\n### Corrections applied during Gate G\n\n1. **p.172 — context-marker position:** moved `(Sound of desk-thumping.)` to immediately after the request to borrow Anna's heart, matching the verified Tamil sequence.\n2. **p.177 — terminology:** `industrial complex` → `industrial undertaking` for verified `தொழில் நிறுவனம்`.\n3. **p.178 — source inconsistency/omission:** restored the explicit 1972 `Tamil Nadu Electronics Corporation — ‘ELCOT’` clause and retained the later 1975 `Electronic Corporation of Tamil Nadu ... ‘ELCOT’` statement, rather than silently reconciling the source's internal chronology.\n4. **p.181 — source-name anomaly:** `Inter Continental Leathers Limited` → `Indar Continental Leathers Limited`, preserving verified `இண்டார் காண்டினென்டல்`.\n5. **p.182 — unsupported inference:** `foundation ceremony` → `commencement ceremony` for verified `தொடக்க விழா`.\n6. **p.184 — terminology:** `Vigilance Wing` → `Vigilance Task Force` for verified `விழிப்புப் பணிக்குழு`.\n7. **p.191 — figure semantics:** `each over 50 hectares` → `each covering 50 hectares`, matching verified `ஒவ்வொன்றும் 50 ஹெக்டேர்`.\n8. **pp.194–195 — source wording:** changed every Jayankondam `lignite` rendering in this passage to `coal`, preserving verified `நிலக்கரி` without adding specificity.\n9. **p.195 — addition removed:** `a single window (Window)` → `a window (Window)`, matching verified `ஒரு சாளரமாகச் (Window)`.\n10. **p.197 — source-name anomaly:** `TANCEM` → `Tansam`, preserving verified `'டான்சம்'` rather than silently normalising the name from outside knowledge.\n11. **p.197 — place wording:** `go back to their constituencies` → `go back home`, matching verified `ஊருக்குப் போவோம்`.\n12. **p.197 — source anomaly/wording:** `I will pursue it without letting go` → `I will make the effort saying, “I will not leave it; I will not touch it,”`, preserving verified `விடேன் தொடேன்` instead of repairing its odd wording.\n\n### Gate-G final checks\n\n- English sections audited: **27/27**, exactly **172–198**;\n- missing / duplicate / reordered English sections: **0 / 0 / 0**;\n- printed English anomalies retained, including `Financial Time`, `Bernard Fintlay`, `transparent appoach`, `Liquified Natural Gas` and the Mark Nicholson quotations/headline;\n- pp.180–181 15-item Joint Sector list checked;\n- pp.185–186 *Economist Intelligence Unit* passage checked;\n- pp.192–193 LNG project and 13-item bidder list checked;\n- pp.194–196 Jayankondam/Singapore/TIDCO projects checked;\n- p.197 rubber-factory humour/source anomaly checked;\n- p.198 front-row/backward wordplay and final grant closure checked;\n- p.199 / Speech-7 spillover: **none**;\n- unresolved English fidelity issues after audit: **0**;\n- English status: **verified**.\n\nThe corrected English has been incorporated after the verified Tamil in canonical [`transcript.md`](./transcript.md).\n\n## Exact next activity — Gate H canonical release/indexing\n\nPerform **Gate H for Speech 6**. Reconcile all Speech-6 canonical and companion files, confirm ID/date/ranges/statuses agree, confirm canonical `transcript.md` contains the complete verified Tamil followed by complete verified English, then update root `README.md` and `data/speeches.json` to release Speech 6 with `transcription_status: verified`, `verified_against_scan: true`, and `translation_status: verified`. Do not begin Speech 7 until Gate H closes.\n'''
          vlog_path.write_text(vl, encoding='utf-8')

          # Final structural assertions after merge.
          final_transcript = transcript_path.read_text(encoding='utf-8')
          if final_transcript.count('# English translation') != 1:
              raise SystemExit('Expected exactly one canonical English translation heading')
          if final_transcript.count('### Source page ') != 27:
              raise SystemExit('Expected exactly 27 canonical English source-page sections')
          if '<!-- source-page: 199 -->' in final_transcript or '### Source page 199' in final_transcript:
              raise SystemExit('Speech-7 spillover detected after canonical merge')

      - name: Commit Speech 6 Gate G completion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            speeches/1997/1997-04-23-industries-debate/translation.md \
            speeches/1997/1997-04-23-industries-debate/transcript.md \
            speeches/1997/1997-04-23-industries-debate/metadata.json \
            speeches/1997/1997-04-23-industries-debate/README.md \
            speeches/1997/1997-04-23-industries-debate/source-notes.md \
            speeches/1997/1997-04-23-industries-debate/verification-log.md
          git diff --cached --check
          git commit -m 'Verify Speech 6 English against final Tamil'
          git push
