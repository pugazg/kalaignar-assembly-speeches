name: Temporary Speech 5 Gate G verification

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-and-merge:
    if: github.event.head_commit.message == 'Temporary verify Speech 5 Gate G'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Gate G fidelity corrections and merge verified English
        shell: python
        run: |
          from pathlib import Path
          import re

          translation = Path('speeches/1996/1996-08-14-industries-debate/translation.md')
          text = translation.read_text(encoding='utf-8')

          replacements = [
              (
                  'when potassium chlorate is purchased as a raw material for match manufacture in Tamil Nadu',
                  'when potassium chloride is purchased as a raw material for match manufacture in Tamil Nadu'
              ),
              (
                  'It was said that it is not necessary to satisfy everybody in the A.I.A.D.M.K. Government; if the “presiding deity” at the top is satisfied, the intended task will be completed. But if, after satisfying that authority, the work does not happen, then it becomes a serious difficulty. Thus—',
                  'We know that, for any task to be accomplished, a bribe has to be paid. But, as far as the A.I.A.D.M.K. Government is concerned, what is irritating is that even after we pay a bribe no work gets done, a well-known industrialist said; and that in the A.I.A.D.M.K. Government it was not necessary to satisfy everyone — if the “presiding deity” at the top was satisfied, the intended task would be completed. But if, even after satisfying that authority, the work did not happen, it became a serious difficulty, he said. Thus—'
              ),
              (
                  "When Thiru Thirunavukkarasu's ten-year dream has today become reality, why should this not be fulfilled?",
                  "When Thiru Thirunavukkarasu's dream — his ten-year dream — has today become a memory, why should this not be fulfilled?"
              ),
              (
                  'in 1994-95 they bought 15,200 metric tonnes of lime at Rs. 200 per metric tonne — paying that additional amount per tonne.',
                  'in 1994-95 they bought 15,200 metric tonnes of lime, paying an additional Rs. 200 per metric tonne.'
              ),
              (
                  'In 1995, without any need at all,, an order was issued to the cooperative and public-sector sugar mills.',
                  'In 1995, without any need at all,, an order was issued to the cooperative and Public Works Department sugar mills.'
              ),
              (
                  'Rajasthan Sheep and Wool::Federation',
                  'Rajasthan Ship and Wool::Federation'
              ),
              (
                  'Allana Sons, Goa —',
                  'Alana Sons, Goa —'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          old_note = '> **Gate F translation note:** This is a faithful English rendering of the final verified Tamil transcription for scan pp.136–171 / printed pp.135–170. It preserves source-page correspondence, parliamentary speaker changes and interventions, names, figures, quotations, technical terminology, argument sequence, and unusual or internally inconsistent source claims without substituting external historical corrections. English passages already printed in the Tamil source are reproduced in their source form, including visible anomalies. This Gate F translation is complete but has **not yet passed Gate G English fidelity verification** against the verified Tamil.'
          new_note = '> **Gate G verification note:** This is the complete English rendering of the final verified Tamil transcription for scan pp.136–171 / printed pp.135–170. It preserves source-page correspondence, parliamentary speaker changes and interventions, names, figures, quotations, technical terminology, argument sequence, and unusual or internally inconsistent source claims without substituting external historical corrections. English passages already printed in the Tamil source are reproduced in their source form, including visible anomalies. Gate F is complete and Gate G has **passed** after a full page-by-page fidelity review of all 36 English source-page sections against the final verified Tamil. Gate-G corrections are documented in `verification-log.md`. English status is **verified**.'
          if text.count(old_note) != 1:
              raise SystemExit('Gate F translation note not found exactly once')
          text = text.replace(old_note, new_note, 1)

          pages = [int(x) for x in re.findall(r'^### Source page (\d+)$', text, flags=re.M)]
          expected = list(range(136, 172))
          if pages != expected:
              raise SystemExit(f'Bad English page sequence after Gate G: {pages}')
          translation.write_text(text, encoding='utf-8')

          transcript = Path('speeches/1996/1996-08-14-industries-debate/transcript.md')
          t = transcript.read_text(encoding='utf-8')
          tamil_pages = [int(x) for x in re.findall(r'^<!-- source-page: (\d+) -->$', t, flags=re.M)]
          if tamil_pages != expected:
              raise SystemExit(f'Bad Tamil page sequence before English merge: {tamil_pages}')
          if '# English translation' in t:
              raise SystemExit('Canonical transcript already contains an English layer')

          old_status = 'Gate F English translation is complete in the working companion `translation.md`, covering all 36 verified source-page sections; Gate G English fidelity verification has not yet started. The verified Tamil in this file remains the controlling translation source.'
          new_status = 'Gate F English translation is complete, and Gate G has now **passed** after a full page-by-page fidelity review of all 36 English source-page sections against the final verified Tamil. The corrected verified English follows after the Tamil source layer. Tamil and English statuses are both **verified**.'
          if t.count(old_status) != 1:
              raise SystemExit('Canonical transcript Gate-F status sentence not found exactly once')
          t = t.replace(old_status, new_status, 1)

          body_marker = '### Source page 136'
          if text.count(body_marker) != 1:
              raise SystemExit('Translation body marker missing or duplicated')
          body = body_marker + text.split(body_marker, 1)[1]
          canonical_note = '> **Translation note:** This is a faithful English rendering of the final verified Tamil transcription for scan pp.136–171 / printed pp.135–170. It preserves source-page correspondence, parliamentary speaker changes and interventions, names, figures, quotations, technical terminology, argument sequence, and unusual or internally inconsistent source claims without substituting external historical corrections. English passages printed in the Tamil source are reproduced in their source form, including visible anomalies. Gate F translation is complete and the full English has passed Gate G page-by-page fidelity verification against the verified Tamil.'
          t = t.rstrip() + '\n\n---\n\n# English translation\n\n' + canonical_note + '\n\n' + body.rstrip() + '\n'
          transcript.write_text(t, encoding='utf-8')

          # Final structural assertions after merge.
          merged = transcript.read_text(encoding='utf-8')
          merged_en_pages = [int(x) for x in re.findall(r'^### Source page (\d+)$', merged, flags=re.M)]
          if merged_en_pages != expected:
              raise SystemExit(f'Bad canonical English page sequence: {merged_en_pages}')
          if merged.count('# English translation') != 1:
              raise SystemExit('Canonical English heading count is not exactly one')

      - name: Commit Gate G verified English
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add speeches/1996/1996-08-14-industries-debate/translation.md speeches/1996/1996-08-14-industries-debate/transcript.md
          git commit -m "Verify Speech 5 English at Gate G"
          git push
