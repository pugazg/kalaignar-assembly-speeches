name: Temporary Speech 5 Gate E3 patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Temporary close Speech 5 Gate E'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final Gate E transcript corrections
        shell: python
        run: |
          from pathlib import Path

          path = Path('speeches/1996/1996-08-14-industries-debate/transcript.md')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '> **Archival transcription note:** This file contains the complete Tamil transcription for PDF scan pp.136–171 / printed pp.135–170 of Speech 5. Gate D full-speech completeness/page-marker audit has passed. Gate E strict visual/source-fidelity verification is **in progress**: scan pp.136–165 / printed pp.135–164 have been checked directly against the controlling scan and source-supported corrections have been applied; scan pp.166–171 remain pending. Tamil status therefore remains **transcribed**, not fully verified. The scan image is authoritative; physical line wrapping is normalised, while printed wording, period spelling, punctuation, numerals, headings, speaker labels, interventions and printed English are preserved as far as the scan permits. English translation remains blocked until Gate E is complete and the Tamil is verified.',
                  '> **Archival transcription note:** This file contains the complete Tamil transcription for PDF scan pp.136–171 / printed pp.135–170 of Speech 5. Gates C and D are complete/passed. Gate E strict visual/source-fidelity verification has now **passed for the complete range**: all 36 scan pages 136–171 were re-read directly against the controlling scan, 23 source-supported corrections were applied across three Gate-E batches, and no unresolved readings remain. Tamil status is **verified**. The scan image is authoritative; physical line wrapping is normalised, while printed wording, period spelling, punctuation, numerals, headings, speaker labels, interventions and printed English are preserved as far as the scan permits. Gate F English translation is now ready but has not started; it must use this verified Tamil as its source.'
              ),
              (
                  'நாட்டிலே மாத்திரமல்ல; உங்களுக்கு சொல்லவேண்டுமேயானால். ராஜஸ்தான் ஷிப் அண்டு உல்::பெடரேஷன்.',
                  'நாட்டிலே மாத்திரமல்ல; உங்களுக்குச் சொல்லவேண்டுமேயானால். ராஜஸ்தான் ஷிப் அண்டு உல்::பெடரேஷன்.'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit verified Tamil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add speeches/1996/1996-08-14-industries-debate/transcript.md
          git commit -m "Pass Speech 5 Gate E Tamil verification"
          git push
