name: Temporary Speech 5 Gate E2 patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Temporary apply Speech 5 Gate E batch 2 corrections'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scan-supported transcript corrections
        shell: python
        run: |
          from pathlib import Path

          path = Path('speeches/1996/1996-08-14-industries-debate/transcript.md')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'Gate E strict visual/source-fidelity verification is **in progress**: scan pp.136–150 / printed pp.135–149 have been checked directly against the controlling scan and source-supported corrections have been applied; scan pp.151–171 remain pending.',
                  'Gate E strict visual/source-fidelity verification is **in progress**: scan pp.136–165 / printed pp.135–164 have been checked directly against the controlling scan and source-supported corrections have been applied; scan pp.166–171 remain pending.'
              ),
              ('தொழிற்சாலை உருவாவதற்குக் தேவை', 'தொழிற்சாலை உருவாவதற்குத் தேவை'),
              ('ஒரு பிரஞ்சு கம்பெனி', 'ஒரு பிரெஞ்சு கம்பெனி'),
              ('அவர்களெல்லாம் உயர்மட்டக் குழுவிலே இருந்தார்கள்.', 'அவர்கள் எல்லாம் உயர்மட்டக் குழுவிலே இருந்தார்கள்.'),
              ('கடைபிடித்து அதிக லாபத்தை, அதிக வருமானத்தை', 'கடைபிடித்து அதிகலாபத்தை, அதிக வருமானத்தை'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit transcript correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add speeches/1996/1996-08-14-industries-debate/transcript.md
          git commit -m "Verify Speech 5 Tamil pp.151-165 against scan"
          git push
